<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <!-- Sealcard frame overlay. Photo hole is transparent (no fill). -->
  <rect width="800" height="1000" rx="4" fill="#FAF8F5"/>
  <rect x="44" y="44" width="712" height="752" fill="none"/>
  <!-- photo hole: omit fill so transparent when composited as mask; document as cutout -->
  <rect x="44" y="44" width="712" height="752" fill="none" stroke="none"/>
</svg>
